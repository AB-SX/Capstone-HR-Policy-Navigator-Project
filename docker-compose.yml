# Production: the app behind Caddy (automatic HTTPS). Secrets come from .env on the server (never in the image).
#   SITE_ADDRESS=13-54-12-34.sslip.io   (your Elastic IP with dots replaced by dashes, + .sslip.io)
services:
  app:
    build: .
    image: hrnav:latest
    env_file: .env
    environment:
      HRNAV_RUNTIME_DIR: /app/runtime
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT_PROD:-hrnav-prod}
    volumes:
      - runtime:/app/runtime
    expose:
      - "8501"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.8
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  runtime:
  caddy_data:
  caddy_config:
